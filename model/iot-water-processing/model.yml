  date-id:
    sources:
      - defaultSource
    s: nbi:$(decoded_payload.name_ID)
    po:
      - [a, saref:Device]
      - p: saref:hasIdentifier
        o:
          value: "$(decoded_payload.name_ID)"
          datatype: xsd:string
      - p: saref:consistsOf
        o:
          - nbi:$(decoded_payload.name_ID)-ec
          - nbi:$(decoded_payload.name_ID)-ph
          - nbi:$(decoded_payload.name_ID)-oxygen
          - nbi:$(decoded_payload.name_ID)-turbidity