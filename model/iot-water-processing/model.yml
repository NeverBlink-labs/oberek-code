prefixes:
  nb: "https://neverblink.eu/ontologies/oberek/"
  nbi: "https://neverblink.eu/oberek/"
  saref: "https://saref.etsi.org/core/"
  s4watr: "https://saref.etsi.org/saref4watr/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  unit: "http://qudt.org/vocab/unit/"
  quantitykind: "http://qudt.org/vocab/quantitykind/"
  s4mari: "https://saref.etsi.org/saref4mari/"
  bufr4_b13: "http://codes.wmo.int/bufr4/b/13/"

sources:
  defaultSource:
    access: data.json
    referenceFormulation: jsonpath
    iterator: $

mappings:

  sensor_ec:
    sources: defaultSource
    s: nbi:$(decoded_payload.name_ID)-ec
    po:
      - [ a, saref:Sensor ]
      - p: saref:madeExecution
        o:
          - value: blank_$(decoded_payload.sampling_date)_sensor_ec_ec_obs
            type: blank
          - value: blank_$(decoded_payload.sampling_date)_sensor_ec_salinity_obs
            type: blank
          - value: blank_$(decoded_payload.sampling_date)_sensor_ec_tds_obs
            type: blank
          - value: blank_$(decoded_payload.sampling_date)_sensor_ec_temp_obs
            type: blank

  sensor_ec_ec_obs:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_ec_obs
      type: blank
    po:
      - [ a, saref:Observation ]
      - [ saref:observes, s4mari:WaterConductivity ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_ec_ec_val
          type: blank

  sensor_ec_ec_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_ec_val
      type: blank
    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, s4mari:WaterConductivity ]
      - [ saref:isMeasuredIn, unit:MicroS-PER-CentiM ]
      - p: saref:hasValue
        o:
          value: $(decoded_payload.sensor_ec.ec)
          datatype: xsd:float

  sensor_ec_salinity_obs:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_salinity_obs
      type: blank
    po:
      - [ a, saref:Observation ]
      - [ saref:observes, s4mari:Salinity ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_ec_salinity_val
          type: blank

  sensor_ec_salinity_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_salinity_val
      type: blank
    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, s4mari:Salinity]
      - [ saref:isMeasuredIn, unit:MilliGM-PER-L ]
      - p: saref:hasValue
        o:
          value: $(decoded_payload.sensor_ec.salinity)
          datatype: xsd:float

  sensor_ec_tds_obs:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_tds_obs
      type: blank
    po:
      - [ a, saref:Observation ]
      - [ saref:observes, s4watr:TotalDissolvedSolids ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_ec_tds_val
          type: blank

  sensor_ec_tds_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_tds_val
      type: blank
    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, s4watr:TotalDissolvedSolids ]
      - [ saref:isMeasuredIn, unit:MilliGM-PER-L ]
      - p: saref:hasValue
        o:
          value: $(decoded_payload.sensor_ec.tds)
          datatype: xsd:float

  sensor_ec_temp_obs:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_temp_obs
      type: blank
    po:
      - [ a, saref:Observation ]
      - [ saref:observes, s4mari:WaterTemperature ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_ec_temp_val
          type: blank

  sensor_ec_temp_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ec_temp_val
      type: blank
    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, s4mari:WaterTemperature ]
      - [ saref:isMeasuredIn, unit:DEG_C ]
      - p: saref:hasValue
        o:
          value: $(decoded_payload.sensor_ec.temp)
          datatype: xsd:float

  sensor_oxygen:
