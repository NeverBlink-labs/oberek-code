  sensor_ph_value_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_ph_value_val
      type: blank
    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, quantitykind:Acidity ]
