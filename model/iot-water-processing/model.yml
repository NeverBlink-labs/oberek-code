    po:
      - [ a, saref:Observation ]
      - [ saref:observes, quantitykind:Acidity ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_ph_value_val
