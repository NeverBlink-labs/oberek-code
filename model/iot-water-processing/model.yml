    s: nbi:$(decoded_payload.name_ID)-oxygen
    po:
      - [ a, saref:Sensor ]
      - p: saref:madeExecution
        o:
          - value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_temp_obs
            type: blank
          - value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_value_obs
            type: blank

  sensor_oxygen_temp_obs:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_temp_obs
      type: blank
    po:
      - [ a, saref:Observation ]
      - [ saref:observes, s4mari:WaterTemperature ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_temp_val
          type: blank

  sensor_oxygen_temp_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_temp_val
      type: blank
    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, s4mari:WaterTemperature ]
      - [ saref:isMeasuredIn, unit:DEG_C ]
      - p: saref:hasValue
        o:
          value: $(decoded_payload.sensor_oxygen.temp)
          datatype: xsd:float

  sensor_oxygen_value_obs:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_value_obs
      type: blank
    po:
      - [ a, saref:Observation ]
      - [ saref:observes, bufr4_b13:083 ]
      - p: saref:hasTimestamp
        o:
          value: "$(decoded_payload.sampling_date)"
          datatype: xsd:dateTime
      - p: saref:hasResult
        o:
          value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_value_val
          type: blank

  sensor_oxygen_value_val:
    sources: defaultSource
    s:
      value: blank_$(decoded_payload.sampling_date)_sensor_oxygen_value_val
