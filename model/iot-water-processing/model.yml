    po:
      - [ a, saref:PropertyValue ]
      - [ saref:isValueOfProperty, s4mari:WaterTemperature ]
      - [ saref:isMeasuredIn, unit:DEG_C ]
      - p: saref:hasValue
        o:
          value: $(decoded_payload.sensor_ph.temp)
